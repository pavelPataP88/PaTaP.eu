name: AUD-008 lockfile helper

on:
  pull_request:
    branches:
      - codex/local-workspace-snapshot
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/aud-008-lockfile-helper.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.head_ref == 'chatgpt/aud-008-web-push-payload-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Generate package-lock with npm
        run: npm install --package-lock-only --ignore-scripts
      - name: Prove lockfile is installable
        run: npm ci --ignore-scripts
      - name: Commit generated package-lock
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "AUD-008: generate package-lock with npm"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
