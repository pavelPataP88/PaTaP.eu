name: AUD-008 lockfile helper

on:
  pull_request:
    branches:
      - codex/local-workspace-snapshot
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/aud-008-lockfile-helper.yml

permissions:
  contents: read

jobs:
  generate-lockfile:
    if: github.head_ref == 'chatgpt/aud-008-web-push-payload-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Generate package-lock with npm
        run: npm install --package-lock-only --ignore-scripts
      - name: Prove lockfile is installable
        run: npm ci --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: aud-008-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
