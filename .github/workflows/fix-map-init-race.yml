name: Fix map init race

on:
  push:
    branches:
      - chatgpt/audit-integration-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/audit-integration-v1
          fetch-depth: 0
      - name: Patch concurrent map initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          map_path = Path('driver/map/index.js')
          s = map_path.read_text()
          old = '''    try { await ensureMapLibre(); } catch { setState("Не удалось загрузить карту. Чат, контакты и профиль продолжают работать.", "error"); return false; }
    try {'''
          new = '''    try { await ensureMapLibre(); } catch { setState("Не удалось загрузить карту. Чат, контакты и профиль продолжают работать.", "error"); return false; }
    // Activation can be requested twice while the lazy loader is pending. Recheck
    // after the await so only one Map/experience overlay can be constructed.
    if (map) return true;
    try {'''
          if s.count(old) != 1:
              raise SystemExit('map init anchor not found exactly once')
          map_path.write_text(s.replace(old, new, 1))

          e2e_path = Path('scripts/run-driver-e2e.js')
          s = e2e_path.read_text()
          old = '''    const layersButton = page.locator('[data-map-experience="layers"]');
    const layersPanel = page.locator(".map-layers-panel");
    const switchRow = page.locator("label.switch-row").filter({ has: toggle });
    await layersButton.waitFor({ state: "visible" });'''
          new = '''    const layersButton = page.locator('#map-view [data-map-experience="layers"]');
    const layersPanel = page.locator("#map-view .map-layers-panel");
    const switchRow = page.locator("#map-view label.switch-row").filter({ has: toggle });
    await page.waitForFunction(() => document.querySelectorAll('#map-view [data-map-experience="layers"]').length >= 1);
    await page.waitForTimeout(50);
    assert.equal(await layersButton.count(), 1, "Map must expose exactly one layers control");
    await layersButton.waitFor({ state: "visible" });'''
          if s.count(old) != 1:
              raise SystemExit('E2E layers anchor not found exactly once')
          e2e_path.write_text(s.replace(old, new, 1))

          test_path = Path('tests/driver/map-enhancements.test.mjs')
          s = test_path.read_text()
          marker = '''test("mobile overlay moves GPS and radius controls onto the map without replacing their handlers", () => {'''
          addition = '''test("map initialization rechecks after lazy MapLibre loading to prevent duplicate overlays", () => {
  const loaderIndex = mapSource.indexOf("await ensureMapLibre()");
  assert.ok(loaderIndex >= 0);
  const afterLoader = mapSource.slice(loaderIndex, loaderIndex + 420);
  assert.match(afterLoader, /if \(map\) return true;/);
});

'''
          if marker not in s:
              raise SystemExit('map enhancement insertion anchor not found')
          if 'prevent duplicate overlays' not in s:
              s = s.replace(marker, addition + marker, 1)
          test_path.write_text(s)

          workflow = Path('.github/workflows/fix-map-init-race.yml')
          workflow.unlink()
          PY
      - name: Commit race fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: serialize lazy map initialization"
          git push origin HEAD:chatgpt/audit-integration-v1
