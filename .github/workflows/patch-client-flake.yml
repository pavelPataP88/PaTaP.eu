name: Patch client test flake

on:
  push:
    branches:
      - chatgpt/audit-integration-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/audit-integration-v1
          fetch-depth: 0
      - name: Make client UI waits deterministic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/browser/client-storage.test.js')
          s = p.read_text()
          old_chat = '''  await page.waitForFunction(() => document.querySelector(".chat-conversation-identity strong")?.textContent.includes("NearbyDriver"));'''
          new_chat = '''  await page.waitForFunction(() =>
            document.querySelector(".chat-conversation-identity strong")?.textContent.includes("NearbyDriver")
            && document.querySelectorAll("#chat-rooms button").length === 2
            && document.querySelectorAll(".chat-message").length === 2
            && document.querySelectorAll(".chat-message .chat-message-menu").length === 2
          );'''
          old_radio = '''  await page.waitForFunction(() => document.querySelectorAll(".radio-transmission").length === 2);'''
          new_radio = '''  await page.waitForFunction(() => {
            const transmissions = Array.from(document.querySelectorAll(".radio-transmission"));
            const downloads = Array.from(document.querySelectorAll(".radio-transmission .message-menu a"))
              .filter((link) => link.textContent.includes("Скачать"));
            return transmissions.length === 2
              && document.querySelectorAll(".radio-transmission .message-menu").length === 2
              && document.querySelectorAll(".radio-audio-player").length === 2
              && downloads.length === 2;
          });'''
          if old_chat not in s or old_radio not in s:
              raise SystemExit('expected client test anchors not found')
          s = s.replace(old_chat, new_chat, 1).replace(old_radio, new_radio, 1)
          p.write_text(s)
          PY
      - name: Commit deterministic test wait
        run: |
          if git diff --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/client-storage.test.js
          git commit -m "test: remove client rendering race"
          git push origin HEAD:chatgpt/audit-integration-v1
