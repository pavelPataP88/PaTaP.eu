name: Verify

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
      - 'codex/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Release context
        shell: bash
        run: |
          echo "commit=$(git rev-parse HEAD)"
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
      - name: Deterministic release verification
        run: npm run verify:release

  windows-driver-e2e:
    name: windows-driver-e2e
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Windows Driver E2E
        run: npm run test:driver-e2e

  public-smoke:
    name: public-smoke-nonblocking
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check current public endpoints
        run: node scripts/run-public-smoke.js